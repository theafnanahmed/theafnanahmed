<svg width="450" height="200" viewBox="0 0 450 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="200" rx="10" fill="#0D1117" stroke="#00F5FF" stroke-width="1.5"/>
  <style>
    .header { font-family: 'Orbitron', 'Segoe UI', Ubuntu, sans-serif; font-weight: 700; font-size: 17px; fill: #00F5FF; }
    .stat-label { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 14px; fill: #E2E8F0; }
    .stat-value { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 600; font-size: 14px; fill: #00FF9D; }
    .icon { fill: #00FF9D; }
    .rank-circle { fill: none; stroke: #00F5FF; stroke-width: 4; }
    .rank-text { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 22px; fill: #00FF9D; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text x="25" y="35" class="header">Afnan's GitHub Stats</text>

  <!-- Rank Ring -->
  <g transform="translate(380, 85)">
    <circle cx="0" cy="0" r="32" class="rank-circle" stroke-dasharray="200" stroke-dashoffset="30"/>
    <text x="0" y="2" class="rank-text">A+</text>
  </g>

  <!-- Stats Rows -->
  <g transform="translate(25, 70)">
    <!-- Total Stars -->
    <g transform="translate(0, 0)">
      <path class="icon" d="M8 0L10.472 5.008L16 5.816L12 9.712L12.944 15.184L8 12.584L3.056 15.184L4 9.712L0 5.816L5.528 5.008L8 0Z"/>
      <text x="25" y="12" class="stat-label">Total Stars Earned:</text>
      <text x="220" y="12" class="stat-value">120+</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 30)">
      <circle cx="8" cy="8" r="6" fill="#00FF9D" />
      <text x="25" y="12" class="stat-label">Total Commits (2026):</text>
      <text x="220" y="12" class="stat-value">850+</text>
    </g>

    <!-- Total PRs -->
    <g transform="translate(0, 60)">
      <circle cx="8" cy="8" r="6" fill="#00F5FF" />
      <text x="25" y="12" class="stat-label">Total PRs &amp; Contributions:</text>
      <text x="220" y="12" class="stat-value">340+</text>
    </g>

    <!-- Contributed To -->
    <g transform="translate(0, 90)">
      <circle cx="8" cy="8" r="6" fill="#FF007F" />
      <text x="25" y="12" class="stat-label">Contributed to Projects:</text>
      <text x="220" y="12" class="stat-value">25 Repo Eco</text>
    </g>
  </g>
</svg>
